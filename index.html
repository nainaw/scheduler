<!DOCTYPE html>
<html lang="mg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anjara Fanompoana Isan-tSabata</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-alt: #eef3f8;
      --ink: #17222d;
      --muted: #526375;
      --primary: #1b4973;
      --primary-dark: #123352;
      --accent: #1f6f78;
      --accent-soft: #e6f4f5;
      --border: #d5e0ea;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(23, 34, 45, 0.05);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.35;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 16px 28px;
    }

    header {
      background: linear-gradient(125deg, var(--primary-dark) 0%, var(--primary) 60%, var(--accent) 100%);
      color: #fff;
      border-radius: var(--radius);
      padding: 12px 18px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    header p {
      margin: 2px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: 0.82rem;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 10px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.88rem;
      color: var(--ink);
      background: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid var(--primary);
      border-color: var(--primary);
    }

    .btn {
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-light {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.32);
    }

    .btn-light:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .personal-box {
      background: var(--accent-soft);
      border: 1px solid #a7d7dc;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
      display: none;
    }

    .personal-box.visible { display: block; }

    .personal-box h3 {
      margin: 0 0 6px;
      font-size: 0.92rem;
      color: #134b52;
    }

    .duty-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 6px;
    }

    .duty-item {
      background: #fff;
      border: 1px solid #c5e3e7;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 0.83rem;
    }

    .duty-date {
      font-weight: 700;
      color: var(--primary);
      font-size: 0.78rem;
    }

    .month-section {
      margin-bottom: 14px;
    }

    .month-section:last-child {
      margin-bottom: 0;
    }

    .month-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 6px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid var(--border);
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--primary);
    }

    .month-pill {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--surface-alt);
      color: var(--muted);
      padding: 1px 8px;
      border-radius: 999px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    th {
      background: var(--primary);
      color: #fff;
      text-align: left;
      padding: 6px 9px;
      font-weight: 600;
      white-space: nowrap;
    }

    th.task-col {
      background: var(--primary-dark);
      width: 84px;
      position: sticky;
      left: 0;
      z-index: 2;
    }

    td {
      padding: 5px 9px;
      border-top: 1px solid var(--border);
      vertical-align: middle;
    }

    td.task-cell {
      font-weight: 700;
      background: var(--surface-alt);
      color: var(--primary);
      white-space: nowrap;
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 1px solid var(--border);
    }

    tbody tr:hover td:not(.task-cell) {
      background: #f4f8fc;
    }

    tbody tr:nth-child(even) td:not(.task-cell) {
      background: #fafcfe;
    }

    td.highlight-match {
      background: #fff3cd !important;
      font-weight: 700;
      color: #664d03;
      outline: 2px solid #e0a800;
      outline-offset: -2px;
    }

    .sabbath-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }

    .sab-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: #fff;
    }

    .sab-card h4 {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .sab-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 0.81rem;
    }

    .sab-card li {
      padding: 3px 0;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px dashed #edf2f7;
    }

    .sab-card li:last-child { border-bottom: none; }

    .badge-task {
      font-weight: 700;
      color: var(--muted);
    }

    .footer-meta {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .admin-panel {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .admin-panel.open { display: block; }

    .link-btn {
      background: none;
      border: none;
      padding: 0;
      color: var(--muted);
      font-size: 0.76rem;
      text-decoration: underline;
      cursor: pointer;
    }

    @media (max-width: 640px) {
      .container {
        padding: 8px 10px 22px;
      }

      header {
        padding: 12px 14px;
      }

      header h1 {
        font-size: 1.08rem;
      }

      header p {
        font-size: 0.78rem;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions .btn {
        flex: 1 1 auto;
        text-align: center;
      }

      .card {
        padding: 10px 12px;
      }

      .toolbar {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      input[type="text"],
      input[type="url"],
      select {
        font-size: 16px;
        padding: 8px 10px;
      }

      .duty-list {
        grid-template-columns: 1fr;
      }

      .sabbath-cards {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 0.79rem;
      }

      th, td {
        padding: 6px 8px;
      }
    }


    .chunk-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .task-label-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: help;
    }

    .task-desc-sub {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      white-space: normal;
      max-width: 240px;
      line-height: 1.25;
      margin-top: 2px;
    }

    .task-legend {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .task-legend strong {
      color: var(--ink);
    }

    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .card { box-shadow: none; border: 1px solid #ccc; padding: 8px; }
      .container { padding: 0; max-width: 100%; }
      th { background: #1b4973 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>

        <h1>Anjara Fanompoana Isan-tSabata</h1>
        <p>Sivana araka ny volana, daty Sabata, na anarana mba hahitana haingana ny andraikitrao.</p>
      </div>
      <div class="header-actions no-print">
        <button class="btn btn-light" onclick="resetFilters()">Averina ny Sivana</button>
        <button class="btn btn-light" onclick="window.print()">Atonta / Tahirizo PDF</button>
      </div>
    </header>

        <div>

            <option value="12">Desambra ihany</option>
            <option value="01">Janoary ihany</option>

        </div>

        <div>

        </div>

        <div>
          <label for="viewMode">Fomba Fiseho</label>

            <option value="one-col">Daty 1 / Tsanganana</option>
            <option value="split-matrix">Tabilao Isam-bolana</option>
            <option value="one-month">Tabilao Volana Iray</option>
            <option value="all-dates-table">Tabilao Daty Rehetra (Taloha &rarr; Vaovao)</option>

        <div>
          <label for="taskDisplayMode">Anaran'ny Asa</label>

            <option value="code-tooltip">Fanafohezana + Fanazavana (Hover)</option>
            <option value="code-and-desc">Fanafohezana + Fanazavana</option>
            <option value="desc-only">Fanazavana Feno</option>
          </select>
        </div>
      </div>

      <div id="personalBox" class="personal-box">
        <h3 id="personalTitle">Ny Andraikitrao</h3>
        <div id="personalDuties" class="duty-list"></div>
      </div>
    </section>

    <section class="card">
      <div id="scheduleContainer"></div>
      <div class="footer-meta">
        <span id="statusBar">Manomana ny fandaharam-potoana...</span>
      </div>

    </section>
  </div>

    function parseDateDDMMYYYY(str) {
      const parts = (str || "").trim().split("/");
      if (parts.length !== 3) return null;
      const d = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      const y = parseInt(parts[2], 10);
      if (!d || !m || !y) return null;
      return new Date(y, m - 1, d);
    }

    function parseCSV(text) {
      const lines = text
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);
      if (lines.length < 2) return [];
      const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, ""));
      const idxDate = headers.findIndex((h) => h.toLowerCase() === "date");
      const idxTask = headers.findIndex((h) => h.toLowerCase() === "task");
      const idxMember = headers.findIndex(
        (h) => h.toLowerCase() === "assignedmember" || h.toLowerCase() === "member"
      );

      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(",").map((c) => c.trim().replace(/^"|"$/g, ""));
        const dateStr = cols[idxDate >= 0 ? idxDate : 0] || "";
        const taskStr = cols[idxTask >= 0 ? idxTask : 1] || "";
        const memberStr = cols[idxMember >= 0 ? idxMember : 2] || "";
        const dt = parseDateDDMMYYYY(dateStr);
        if (dateStr && taskStr) {
          rows.push({
            Date: dateStr,
            Task: taskStr,
            AssignedMember: memberStr,
            _dt: dt,
            _month: dt ? String(dt.getMonth() + 1).padStart(2, "0") : "",
            _year: dt ? dt.getFullYear() : "",
          });
        }
      }
      return rows;
    }


    function populateMonthDropdown() {
      const select = document.getElementById("monthFilter");
      const prev = select.value;

      const uniqueMonths = Array.from(
        new Map(
          allRows
            .filter((r) => r._month && r._dt)
            .map((r) => {
              const y = r._dt.getFullYear();
              const m = String(r._dt.getMonth() + 1).padStart(2, "0");
              const sortKey = y * 100 + (r._dt.getMonth() + 1);
              return [`${y}-${m}`, { month: m, year: y, sortKey }];
            })
        ).values()
      ).sort((a, b) => a.sortKey - b.sortKey);

      const rangeLabels = uniqueMonths.map((item) => {
        const shortM = (MONTH_NAMES[item.month] || item.month).slice(0, 3);
        return `${shortM} ${item.year}`;
      });
      const allLabel =
        rangeLabels.length > 1
          ? `Volana Rehetra (${rangeLabels[0]}–${rangeLabels[rangeLabels.length - 1]})`
          : rangeLabels.length === 1
          ? `Volana Rehetra (${rangeLabels[0]})`
          : "Volana Rehetra";

      select.innerHTML = `<option value="ALL">${allLabel}</option>`;
      for (const item of uniqueMonths) {
        const opt = document.createElement("option");
        opt.value = item.month;
        const mName = MONTH_NAMES[item.month] || item.month;
        opt.textContent = `${mName} ${item.year} ihany`;
        select.appendChild(opt);
      }

      if ([...select.options].some((o) => o.value === prev)) {
        select.value = prev;
      } else {
        select.value = "ALL";
      }
    }

    function populateSabbathDropdown() {
      const select = document.getElementById("sabbathFilter");
      const monthVal = document.getElementById("monthFilter").value;
      const prev = select.value;

      const uniqueDates = Array.from(
        new Map(
          allRows
            .filter((r) => monthVal === "ALL" || r._month === monthVal)
            .map((r) => [r.Date, r._dt])
        ).entries()
      ).sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0));

      select.innerHTML = `<option value="ALL">Sabata Rehetra</option>`;
      for (const [dStr] of uniqueDates) {
        const opt = document.createElement("option");
        opt.value = dStr;
        opt.textContent = dStr;
        select.appendChild(opt);
      }
      if ([...select.options].some((o) => o.value === prev)) {
        select.value = prev;
      }
    }

    function renderPersonalBox(filteredRows, query) {
      const box = document.getElementById("personalBox");
      const title = document.getElementById("personalTitle");
      const list = document.getElementById("personalDuties");
      const q = query.trim().toLowerCase();

      if (!q) {
        box.classList.remove("visible");
        return;
      }

      const rankIndex = new Map(taskOrder.map((code, idx) => [code, idx]));
      const matches = filteredRows
        .filter((r) => r.AssignedMember.toLowerCase().includes(q))
        .sort((a, b) => {
          const da = a._dt ? a._dt.getTime() : 0;
          const db = b._dt ? b._dt.getTime() : 0;
          if (da !== db) return da - db;
          const ra = rankIndex.has(a.Task) ? rankIndex.get(a.Task) : 999999;
          const rb = rankIndex.has(b.Task) ? rankIndex.get(b.Task) : 999999;
          return ra - rb;
        });
      box.classList.add("visible");
      title.textContent = `Andraikitra mifanaraka amin'ny "${query.trim()}" (${matches.length})`;

      if (matches.length === 0) {
        list.innerHTML = `<div class="duty-item">Tsy misy andraikitra hita araka ity sivana ity.</div>`;
        return;
      }

      list.innerHTML = matches
        .map(
          (m) => `
          <div class="duty-item">
            <div class="duty-date">${m.Date}</div>
            <div><strong>${m.Task}</strong> &rarr; ${m.AssignedMember}</div>
          </div>`
        )
        .join("");
    }

    function buildMonthMatrix(monthRows, memberQuery) {
      const dates = Array.from(
        new Map(monthRows.map((r) => [r.Date, r._dt])).entries()
      )
        .sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0))
        .map(([d]) => d);

      const tasks = getOrderedTasks(allRows);
      const lookup = {};
      for (const r of monthRows) {
        lookup[`${r.Task}|||${r.Date}`] = r.AssignedMember;
      }

      const thCols = dates.map((d) => `<th>${d}</th>`).join("");
      const bodyRows = tasks
        .map((t) => {
          const tds = dates
            .map((d) => {
              const val = lookup[`${t}|||${d}`] || "";
              const isHit = memberQuery && val.toLowerCase().includes(memberQuery);
              return `<td class="${isHit ? "highlight-match" : ""}">${val}</td>`;
            })
            .join("");
          return `<tr><td class="task-cell">${renderTaskCellContent(t)}</td>${tds}</tr>`;
        })
        .join("");

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th class="task-col">Asa</th>${thCols}</tr>
            </thead>
            <tbody>${bodyRows}</tbody>
          </table>
        </div>`;
    }


    function parseTasksCSV(text) {
      const map = {};
      const entries = [];
      const lines = (text || "")
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter((l) => l.length > 0);
      if (lines.length < 2) return { map, order: [] };
      const headers = lines[0].split(",").map((h) => h.trim().replace(/^"|"$/g, "").toLowerCase());
      const idxRank = headers.findIndex((h) => h === "id" || h === "rank" || h === "order" || h === "no");
      const idxName = headers.findIndex((h) => h === "name" || h === "task" || h === "code");
      const idxDesc = headers.findIndex((h) => h === "description" || h === "desc" || h === "label");
      for (let i = 1; i < lines.length; i++) {
        const raw = lines[i];
        let cols = [];
        if (raw.includes('"')) {
          const matches = raw.match(/(".*?"|[^",]+)(?=,|$)/g) || [];
          cols = matches.map((c) => c.trim().replace(/^"|"$/g, ""));
        } else {
          cols = raw.split(",").map((c) => c.trim());
        }
        const tCode = (cols[idxName >= 0 ? idxName : 1] || "").trim();
        const tDesc = (cols[idxDesc >= 0 ? idxDesc : 2] || "").trim();
        const rawRank = idxRank >= 0 ? parseInt(cols[idxRank], 10) : i;
        const rankVal = Number.isFinite(rawRank) ? rawRank : i;
        if (tCode) {
          map[tCode] = tDesc || tCode;
          entries.push({ code: tCode, rank: rankVal, seq: i });
        }
      }
      entries.sort((a, b) => (a.rank !== b.rank ? a.rank - b.rank : a.seq - b.seq));
      const order = Array.from(new Set(entries.map((e) => e.code)));
      return { map, order };
    }

    function getOrderedTasks(rows) {
      const present = Array.from(new Set((rows || allRows).map((r) => r.Task)));
      if (!taskOrder || taskOrder.length === 0) return present;
      const rankIndex = new Map(taskOrder.map((code, idx) => [code, idx]));
      return present.sort((a, b) => {
        const ra = rankIndex.has(a) ? rankIndex.get(a) : 999999;
        const rb = rankIndex.has(b) ? rankIndex.get(b) : 999999;
        return ra - rb;
      });
    }

    function getTaskTitleAttr(taskCode) {
      const desc = taskDescriptions[taskCode];
      return desc && desc !== taskCode ? `${taskCode}: ${desc}` : taskCode;
    }

    function renderTaskCellContent(taskCode) {
      const modeEl = document.getElementById("taskDisplayMode");
      const labelMode = modeEl ? modeEl.value : "code-tooltip";
      const desc = taskDescriptions[taskCode] || "";
      const titleAttr = getTaskTitleAttr(taskCode).replace(/"/g, "&quot;");

      if (labelMode === "desc-only" && desc) {
        return `<span class="task-label-wrap" title="${titleAttr}">${desc}</span>`;
      }
      if (labelMode === "code-and-desc" && desc && desc !== taskCode) {
        return `<span class="task-label-wrap" title="${titleAttr}"><span>${taskCode}</span></span><span class="task-desc-sub">${desc}</span>`;
      }
      return `<span class="task-label-wrap" title="${titleAttr}">${taskCode}</span>`;
    }

    function buildContinuousFourColView(rows, memberQuery) {
      const sortedDates = Array.from(
        new Map(rows.map((r) => [r.Date, r._dt])).entries()
      )
        .sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0))
        .map(([d]) => d);

      const tasks = getOrderedTasks(allRows);
      const lookup = {};
      for (const r of rows) {
        lookup[`${r.Task}|||${r.Date}`] = r.AssignedMember;
      }

      const isMobile = window.innerWidth <= 640;
      const chunkSize = isMobile ? 1 : 4;
      const chunks = [];
      for (let i = 0; i < sortedDates.length; i += chunkSize) {
        chunks.push(sortedDates.slice(i, i + chunkSize));
      }

      const chunksHtml = chunks
        .map((dateGroup, idx) => {
          const thCols = dateGroup.map((d) => `<th>${d}</th>`).join("");
          const bodyRows = tasks
            .map((t) => {
              const tds = dateGroup
                .map((d) => {
                  const val = lookup[`${t}|||${d}`] || "";
                  const isHit = memberQuery && val.toLowerCase().includes(memberQuery);
                  return `<td class="${isHit ? "highlight-match" : ""}">${val}</td>`;
                })
                .join("");
              return `<tr><td class="task-cell">${renderTaskCellContent(t)}</td>${tds}</tr>`;
            })
            .join("");

          const spanLabel =
            dateGroup.length > 1
              ? `${dateGroup[0]} &rarr; ${dateGroup[dateGroup.length - 1]}`
              : dateGroup[0];

          return `
            <div class="month-section">
              <div class="month-heading">
                <span>Fizarana ${idx + 1}: ${spanLabel}</span>
                <span class="month-pill">${dateGroup.length} Sabata</span>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th class="task-col">Asa</th>${thCols}</tr>
                  </thead>
                  <tbody>${bodyRows}</tbody>
                </table>
              </div>
            </div>`;
        })
        .join("");

      const legendItems = tasks
        .filter((t) => taskDescriptions[t] && taskDescriptions[t] !== t)
        .map((t) => `<strong>${t}</strong>: ${taskDescriptions[t]}`)
        .join(" &bull; ");

      const legendHtml = legendItems
        ? `<div class="task-legend"><strong>Fanazavana ny Asa:</strong> ${legendItems}</div>`
        : "";

      return `<div class="chunk-grid">${chunksHtml}</div>${legendHtml}`;
    }


    function isMobileDevice() {
      return window.innerWidth <= 640 || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
    }

    function buildContinuousOneColView(rows, memberQuery) {
      const sortedDates = Array.from(
        new Map(rows.map((r) => [r.Date, r._dt])).entries()
      )
        .sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0))
        .map(([d]) => d);

      const tasks = getOrderedTasks(allRows);
      const lookup = {};
      for (const r of rows) {
        lookup[`${r.Task}|||${r.Date}`] = r.AssignedMember;
      }

      const chunksHtml = sortedDates
        .map((dStr, idx) => {
          const bodyRows = tasks
            .map((t) => {
              const val = lookup[`${t}|||${dStr}`] || "";
              const isHit = memberQuery && val.toLowerCase().includes(memberQuery);
              return `<tr><td class="task-cell">${renderTaskCellContent(t)}</td><td class="${isHit ? "highlight-match" : ""}">${val}</td></tr>`;
            })
            .join("");

          return `
            <div class="month-section">
              <div class="month-heading">
                <span>${idx + 1}. ${dStr}</span>
                <span class="month-pill">1 Sabata</span>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr><th class="task-col">Asa</th><th>${dStr}</th></tr>
                  </thead>
                  <tbody>${bodyRows}</tbody>
                </table>
              </div>
            </div>`;
        })
        .join("");

      const legendItems = tasks
        .filter((t) => taskDescriptions[t] && taskDescriptions[t] !== t)
        .map((t) => `<strong>${t}</strong>: ${taskDescriptions[t]}`)
        .join(" &bull; ");

      const legendHtml = legendItems
        ? `<div class="task-legend"><strong>Fanazavana ny Asa:</strong> ${legendItems}</div>`
        : "";

      return `<div class="chunk-grid">${chunksHtml}</div>${legendHtml}`;
    }

    function renderSchedule() {
      const monthVal = document.getElementById("monthFilter").value;
      const sabVal = document.getElementById("sabbathFilter").value;
      const memberQuery = document.getElementById("memberSearch").value.trim().toLowerCase();
      const mode = document.getElementById("viewMode").value;

      const filtered = allRows.filter((r) => {
        if (monthVal !== "ALL" && r._month !== monthVal) return false;
        if (sabVal !== "ALL" && r.Date !== sabVal) return false;
        return true;
      });

      renderPersonalBox(filtered, memberQuery);

      const container = document.getElementById("scheduleContainer");

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color: var(--muted);">Tsy misy fandaharam-potoana mifanaraka amin'ny sivana voafidy.</p>`;
        return;
      }

      if (mode === "one-col") {
        container.innerHTML = buildContinuousOneColView(filtered, memberQuery);
        return;
      }

      if (mode === "continuous-4") {
        container.innerHTML = buildContinuousFourColView(filtered, memberQuery);
        return;
      }

      if (mode === "all-dates-table") {
        const allDatesCount = new Set(filtered.map((r) => r.Date)).size;
        const sortedDates = Array.from(
          new Map(filtered.map((r) => [r.Date, r._dt])).entries()
        )
          .sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0))
          .map(([d]) => d);
        const rangeText =
          sortedDates.length > 1
            ? `${sortedDates[0]} &rarr; ${sortedDates[sortedDates.length - 1]}`
            : sortedDates[0] || "";

        container.innerHTML = `
          <div class="month-section">
            <div class="month-heading">
              <span>Fandaharam-potoana Rehetra (${rangeText})</span>
              <span class="month-pill">${allDatesCount} Sabata</span>
            </div>
            ${buildMonthMatrix(filtered, memberQuery)}
          </div>`;
        return;
      }

      const monthSortMap = new Map();
      for (const r of filtered) {
        if (r._month && !monthSortMap.has(r._month)) {
          const sk = r._dt ? r._dt.getFullYear() * 100 + (r._dt.getMonth() + 1) : 999999;
          monthSortMap.set(r._month, sk);
        }
      }
      let monthKeys = Array.from(monthSortMap.keys()).sort(
        (a, b) => monthSortMap.get(a) - monthSortMap.get(b)
      );
      if (mode === "one-month" && monthVal === "ALL" && monthKeys.length > 0) {
        monthKeys = [monthKeys[0]];
      }

      if (mode === "cards") {
        container.innerHTML = monthKeys
          .map((mKey) => {
            const mRows = filtered.filter((r) => r._month === mKey);
            const mLabel = MONTH_NAMES[mKey] || mKey;
            const year = mRows[0] && mRows[0]._year ? ` ${mRows[0]._year}` : "";
            const dates = Array.from(new Map(mRows.map((r) => [r.Date, r._dt])).entries())
              .sort((a, b) => (a[1] && b[1] ? a[1] - b[1] : 0))
              .map(([d]) => d);
            const tasks = getOrderedTasks(allRows);
            const lookup = {};
            for (const r of mRows) lookup[`${r.Task}|||${r.Date}`] = r.AssignedMember;

            const cardsHtml = dates
              .map((d) => {
                const items = tasks
                  .map((t) => {
                    const assignee = lookup[`${t}|||${d}`] || "—";
                    const isHit = memberQuery && assignee.toLowerCase().includes(memberQuery);
                    return `<li style="${isHit ? "background:#fff3cd;font-weight:700;border-radius:5px;padding:3px 6px;" : ""}">
                      <span class="badge-task" title="${getTaskTitleAttr(t).replace(/"/g, '&quot;')}">${t}</span>
                      <span>${assignee}</span>
                    </li>`;
                  })
                  .join("");
                return `<div class="sab-card"><h4>${d}</h4><ul>${items}</ul></div>`;
              })
              .join("");

            return `
              <div class="month-section">
                <div class="month-heading">
                  <span>${mLabel}${year}</span>
                  <span class="month-pill">${dates.length} Sabata</span>
                </div>
                <div class="sabbath-cards">${cardsHtml}</div>
              </div>`;
          })
          .join("");
        return;
      }

      container.innerHTML = monthKeys
        .map((mKey) => {
          const mRows = filtered.filter((r) => r._month === mKey);
          const mLabel = MONTH_NAMES[mKey] || mKey;
          const year = mRows[0] && mRows[0]._year ? ` ${mRows[0]._year}` : "";
          const sabCount = new Set(mRows.map((r) => r.Date)).size;
          return `
            <div class="month-section">
              <div class="month-heading">
                <span>${mLabel}${year}</span>
                <span class="month-pill">${sabCount} Sabata</span>
              </div>
              ${buildMonthMatrix(mRows, memberQuery)}
            </div>`;
        })
        .join("");
    }



    function loadLocalCsvFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = (e.target && e.target.result) || "";
        const parsed = parseCSV(text);
        if (!parsed.length) {
          document.getElementById("statusBar").textContent = "Tsy afaka novakiana ny rakitra CSV voafidy.";
          return;
        }
        allRows = parsed;
        populateMonthDropdown();
        populateSabbathDropdown();
        renderSchedule();
        document.getElementById("statusBar").textContent = `Vaky ny andalana ${parsed.length} avy amin'ny ${file.name}.`;
      };
      reader.readAsText(file);
    }

    function applyPastedCsv() {
      const txt = (document.getElementById("pasteCsvInput").value || "").trim();
      if (!txt) return;
      const parsed = parseCSV(txt);
      if (!parsed.length) {
        document.getElementById("statusBar").textContent = "Tsy afaka novakiana ny CSV napetaka (andrasana: Date,Task,AssignedMember).";
        return;
      }
      allRows = parsed;
      populateSabbathDropdown();
      renderSchedule();
      document.getElementById("statusBar").textContent = `Vaky ny andalana ${parsed.length} avy amin'ny CSV napetaka.`;
    }

    function resetFilters() {
      document.getElementById("monthFilter").value = "ALL";
      populateSabbathDropdown();
      document.getElementById("sabbathFilter").value = "ALL";
      document.getElementById("memberSearch").value = "";
      document.getElementById("taskDisplayMode").value = "desc-only";
      document.getElementById("viewMode").value = isMobileDevice() ? "one-col" : "continuous-4";
      renderSchedule();
    }

    async function loadFromUrl(customUrl) {
      const url = (customUrl || DEFAULT_CSV_URL || "").trim();
      if (!url) return;
      const statusEl = document.getElementById("statusBar");
      statusEl.textContent = "Mampifanaraka ny fandaharam-potoana...";
      try {
        const bustUrl = url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
        const res = await fetch(bustUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const parsed = parseCSV(csvText);
        if (!parsed.length) throw new Error("Tsy misy andalana manan-kery hita.");
        allRows = parsed;
        populateMonthDropdown();
        populateSabbathDropdown();
        renderSchedule();
        statusEl.textContent = `Voaavao ny angona: andalana ${parsed.length} (${new Date().toLocaleTimeString()}).`;
      } catch (err) {
        statusEl.textContent = `Fanamarihana fanavaozana: ${err.message}`;
      }
    }

    document.getElementById("monthFilter").addEventListener("change", () => {
      populateSabbathDropdown();
      renderSchedule();
    });
    document.getElementById("sabbathFilter").addEventListener("change", renderSchedule);
    document.getElementById("memberSearch").addEventListener("input", renderSchedule);
    document.getElementById("viewMode").addEventListener("change", renderSchedule);

    async function loadTasksFromUrl(tasksUrl) {
      const url = (tasksUrl || DEFAULT_TASKS_CSV_URL || "").trim();
      if (!url) return;
      try {
        const bustUrl = url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
        const res = await fetch(bustUrl);
        if (!res.ok) return;
        const txt = await res.text();
        const parsedTasks = parseTasksCSV(txt);
        if (Object.keys(parsedTasks.map).length > 0) {
          taskDescriptions = { ...taskDescriptions, ...parsedTasks.map };
          if (parsedTasks.order.length > 0) {
            taskOrder = parsedTasks.order;
          }
          renderSchedule();
        }
      } catch (_) {
        // Keep defaults if Tasks.csv is not hosted at that path
      }
    }

    document.getElementById("taskDisplayMode").addEventListener("change", renderSchedule);
    window.addEventListener("resize", () => {
      if (document.getElementById("viewMode").value === "continuous-4") {
        renderSchedule();
      }
    });

    const initTasks = parseTasksCSV(DEFAULT_TASKS_CSV);
    taskDescriptions = initTasks.map;
    taskOrder = initTasks.order;
    const mobileUser = isMobileDevice();
    document.getElementById("taskDisplayMode").value = "desc-only";
    document.getElementById("viewMode").value = mobileUser ? "one-col" : "continuous-4";
    allRows = parseCSV(SAMPLE_CSV);
    populateMonthDropdown();
    populateSabbathDropdown();
    renderSchedule();

    const params = new URLSearchParams(window.location.search);
    const activeUrl = params.get("csv") || DEFAULT_CSV_URL;
    const activeTasksUrl = params.get("tasks") || DEFAULT_TASKS_CSV_URL;
    if (activeTasksUrl) {
      loadTasksFromUrl(activeTasksUrl);
    }
    if (activeUrl) {
      loadFromUrl(activeUrl);
      setInterval(() => loadFromUrl(activeUrl), 5 * 60 * 1000);
    }
  </script>
